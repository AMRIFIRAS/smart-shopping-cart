<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Smart Cart: a fresh take on grocery shopping. Explore, scan, and check out in this graduation project demo.">
  <meta name="theme-color" content="#176344">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smart Cart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Smart Cart</title>
  <style>
    body { margin: 0; background: #faf9f5; }
    #loading { min-height: 100vh; display: grid; place-content: center; text-align: center; color: #176344; font: 16px Arial, sans-serif; }
    #loading strong { font-size: 30px; letter-spacing: -1px; }
    #loading p { color: #718078; }
  </style>
</head>
<body>
  <div id="loading" role="status"><strong>SmartCart</strong><p id="loading-message">Getting your shopping trip ready…</p></div>
  <noscript>Please enable JavaScript to use SmartCart. يرجى تفعيل جافاسكريبت لاستخدام SmartCart.</noscript>
  <script>
    try {
      const saved = localStorage.getItem('flutter.smartcart.language');
      if (saved === 'ar' || saved === '"ar"') {
        document.documentElement.lang = 'ar';
        document.getElementById('loading').dir = 'rtl';
        document.getElementById('loading-message').textContent = 'جارٍ تجهيز رحلة التسوّق…';
      }
    } catch (_) { /* Shopping still works when browser storage is unavailable. */ }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
